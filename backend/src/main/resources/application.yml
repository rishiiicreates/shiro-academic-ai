server:
  port: 8080

spring:
  application:
    name: chiroshiro-backend
  main:
    web-application-type: reactive

sidecar:
  url: ${SIDECAR_URL:http://127.0.0.1:8001}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
  model: ${OLLAMA_MODEL:llama3.1:8b}
  temperature: ${OLLAMA_TEMPERATURE:0.2}

storage:
  data-dir: ${DATA_DIR:./data}
